volumes:
  # A named volume to share data between containers
  yelukerest-pg-data:
    name: ${PG_DATA_VOLUME_NAME}
    # External here indicates that the user must have
    # created this volume independently. It must exist
    # if you want to bring these services that depend
    # on it up. (Postgres in production depends on this
    # volume for persistence. 
    # See https://docs.docker.com/engine/admin/volumes/volumes/
    external: true
  postgres-run:
services:

  # This is the database to which the all the other components in the stack will connect and interact with
  # (but mostly it's PostgREST that is going to be responsible for the bulk of the db traffic)
  # Having the database in a container is very convinient in development but in production you will
  # use a separate database instance, like Amazon RDS, i.e. in production this section will be
  # commented and in the .env file you will specify the ip of your separate database instance
  db:
    restart: unless-stopped
    build:
      context: db
      target: prod
    image: yelukerest-postgres:18.4-pgbackrest
    ports:
      - "127.0.0.1:5432:${DB_PORT}"
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/pgbackrest-archive-push.sh %p
      - -c
      - archive_timeout=60s
    # Lets dependents (hydra-migrate) wait for Postgres to accept
    # connections rather than merely for the container to start.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPER_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      # env vars specific to postgres image used on first boot
      - POSTGRES_USER=${SUPER_USER}
      - POSTGRES_PASSWORD=${SUPER_USER_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      # env vars useful for our sql scripts
      - SUPER_USER=${SUPER_USER}
      - SUPER_USER_PASSWORD=${SUPER_USER_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_ANON_ROLE=${DB_ANON_ROLE}
      - DEVELOPMENT=${DEVELOPMENT}
      - JWT_SECRET=${JWT_SECRET}
      - S3_REGION=${BACKUP_S3_REGION}
      - S3_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${BACKUP_S3_BUCKET}
      - S3_PREFIX=${BACKUP_S3_PREFIX}
      - S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-**None**}
      - PGBACKREST_REPO1_STORAGE_PORT=${PGBACKREST_REPO1_STORAGE_PORT:-443}
      - PGBACKREST_REPO1_STORAGE_VERIFY_TLS=${PGBACKREST_REPO1_STORAGE_VERIFY_TLS:-y}
      - PGBACKREST_REPO1_S3_URI_STYLE=${PGBACKREST_REPO1_S3_URI_STYLE:-host}
      - POSTGRES_DATA_PATH=/var/lib/postgresql/18/docker

    volumes:
      - yelukerest-pg-data:/var/lib/postgresql
      - postgres-run:/var/run/postgresql
      # One-time hydra database/role bootstrap helper. NOT run
      # automatically in production (initdb.d only runs on an empty data
      # dir); see the header of the script and docs/hydra.md.
      - "./hydra/sql/create-hydra-db.sh:/opt/hydra/create-hydra-db.sh:ro"

  # One-shot Hydra schema migration job (issue #270). Runs
  # `hydra migrate sql up` against the dedicated hydra database and
  # exits; the hydra service waits for it to complete successfully.
  # Prerequisite: the hydra database/role exist (docs/hydra.md).
  hydra-migrate:
    image: oryd/hydra:v26.2.0
    command: migrate sql up -e --yes
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DSN=postgres://${HYDRA_DB_USER:-hydra}:${HYDRA_DB_PASS}@${DB_HOST}:${DB_PORT}/${HYDRA_DB_NAME:-hydra}?sslmode=disable&max_conns=8&max_idle_conns=2

  hydra:
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      # Dedicated least-privilege database/role; Hydra never touches the
      # application database. sslmode=disable is acceptable only because
      # the connection stays on the internal compose network.
      - DSN=postgres://${HYDRA_DB_USER:-hydra}:${HYDRA_DB_PASS}@${DB_HOST}:${DB_PORT}/${HYDRA_DB_NAME:-hydra}?sslmode=disable&max_conns=8&max_idle_conns=2

  backup:
    restart: unless-stopped
    build: backup
    environment:
      - SCHEDULE=${BACKUP_SCHEDULE}
      - BACKUP_FULL_INTERVAL_DAYS=${BACKUP_FULL_INTERVAL_DAYS:-7}
      - S3_REGION=${BACKUP_S3_REGION}
      - S3_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${BACKUP_S3_BUCKET}
      - S3_PREFIX=${BACKUP_S3_PREFIX}
      - S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-**None**}
      - PGBACKREST_REPO1_STORAGE_PORT=${PGBACKREST_REPO1_STORAGE_PORT:-443}
      - PGBACKREST_REPO1_STORAGE_VERIFY_TLS=${PGBACKREST_REPO1_STORAGE_VERIFY_TLS:-y}
      - PGBACKREST_REPO1_S3_URI_STYLE=${PGBACKREST_REPO1_S3_URI_STYLE:-host}
      - POSTGRES_USER=${SUPER_USER}
      - POSTGRES_PASSWORD=${SUPER_USER_PASSWORD}
      - POSTGRES_PORT=5432
      - POSTGRES_DATA_PATH=/var/lib/postgresql/18/docker
      - POSTGRES_SOCKET_PATH=/var/run/postgresql
    volumes:
      - yelukerest-pg-data:/var/lib/postgresql:ro
      - postgres-run:/var/run/postgresql:ro
      # The pages students publish for the tacky-website activity, which are
      # graded artifacts that pgBackRest does not cover (issue #369). Read-only:
      # this container only ever tars it up, and codeframe is the one writer.
      - codeframe_db:/codeframe/db:ro
