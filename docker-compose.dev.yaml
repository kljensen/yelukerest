services:

  # This is the database to which the all the other components in the stack will connect and interact with
  # (but mostly it's PostgREST that is going to be responsible for the bulk of the db traffic)
  # Having the database in a container is very convinient in development but in production you will
  # use a separate database instance, like Amazon RDS, i.e. in production this section will be
  # commented and in the .env file you will specify the ip of your separate database instance
  db:
    image: ${POSTGRES_DEV_IMAGE:-postgres:18.4}
    ports:
      - "127.0.0.1:5432:${DB_PORT}"
    environment:
      # env vars specific to postgres image used on first boot
      - POSTGRES_USER=${SUPER_USER}
      - POSTGRES_PASSWORD=${SUPER_USER_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      # Used by the hydra init script below (not by db/src scripts).
      - HYDRA_DB_USER=${HYDRA_DB_USER:-hydra}
      - HYDRA_DB_PASS=${HYDRA_DB_PASS:-hydra-dev-password}

    volumes:
      # Create the dedicated hydra database/role on first boot so a
      # Postgres-backed Hydra (CI/test profile; concurrency-sensitive
      # tests) can run against the dev database container. The zzz-
      # prefix makes the entrypoint run it during first boot. This
      # deliberately lives outside db/src (see issue #270).
      - "./hydra/sql/create-hydra-db.sh:/docker-entrypoint-initdb.d/zzz-create-hydra-db.sh:ro"

  authapp:
    environment:
      # The end-to-end suite drives dozens of authorizations from one
      # address in a couple of minutes; production keeps the 60/min
      # default. See authapp/main.go.
      - OAUTH_RATE_LIMIT_PER_MINUTE=${OAUTH_RATE_LIMIT_PER_MINUTE:-1000}
      - CAS_VALIDATION_URI=http://authapp:${AUTHAPP_PORT}/cas/serviceValidate
      # In development the stack is served at https://localhost via Caddy;
      # FQDN may be unset, so pin the MCP resource URL explicitly (used
      # as the DCR audience allowlist, issue #272).
      - MCP_RESOURCE_URL=${MCP_RESOURCE_URL:-https://localhost/mcp}

  mcpapp:
    environment:
      # In development the stack is served at https://localhost via Caddy;
      # FQDN may be unset, so pin the MCP resource URL explicitly.
      - MCP_RESOURCE_URL=${MCP_RESOURCE_URL:-https://localhost/mcp}
      - HYDRA_PUBLIC_URL=${HYDRA_PUBLIC_URL:-https://localhost}
      # The agent dogfood suite drives many tool calls under one token
      # subject while a model decides what to call, which real traffic does
      # not; production keeps the 120/min default. See mcpapp/main.go.
      - MCP_RATE_LIMIT_PER_MINUTE=${MCP_RATE_LIMIT_PER_MINUTE:-1000}

  hydra:
    # DEV ONLY. Hydra's admin API is unauthenticated -- anything that reaches
    # it can mint clients and revoke consent -- so it is never published in
    # production, where the only route to it is inside the compose network.
    #
    # Publishing it on loopback here lets the OAuth tests call it directly with
    # fetch(). They used to shell into the db container and pipe a hand-rolled
    # HTTP request through `nc`; postgres:18.4 moved to Debian trixie, which
    # ships no netcat, so those calls started failing and three security
    # assertions went quietly dead while the suite still looked green.
    ports:
      - '127.0.0.1:4445:4445'
    environment:
      # In-memory storage for the fast interactive dev loop ONLY: all
      # clients/tokens are lost on restart, and SQLite-in-memory masks
      # locking races. Concurrency-sensitive tests (refresh reuse,
      # restart survival) must use the Postgres-backed configuration
      # (see docs/hydra.md).
      - DSN=memory
      # Dev serves at https://localhost via Caddy (see mcpapp above).
      - URLS_SELF_ISSUER=${HYDRA_DEV_ISSUER:-https://localhost}
      - URLS_LOGIN=${HYDRA_DEV_ISSUER:-https://localhost}/auth/oauth/login
      - URLS_CONSENT=${HYDRA_DEV_ISSUER:-https://localhost}/auth/oauth/consent
      - WEBFINGER_OIDC_DISCOVERY_CLIENT_REGISTRATION_URL=${HYDRA_DEV_ISSUER:-https://localhost}/oauth2/register
      # A dev-only default so `./bin/dev.sh up` works out of the box;
      # production MUST set HYDRA_SECRETS_SYSTEM in .env.
      - SECRETS_SYSTEM=${HYDRA_SECRETS_SYSTEM:-dev-only-insecure-hydra-system-secret}
