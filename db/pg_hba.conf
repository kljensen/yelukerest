# Client authentication for the production Postgres container.
#
# Mounted into the db service and selected with `-c hba_file=` so that the
# rules live in git rather than in the data volume, where the postgres image
# wrote its defaults at initdb time. First match wins, so order matters.
#
# Production publishes Postgres on the host's loopback interface. Administrative
# access uses an SSH tunnel; other containers use the Compose network.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Inside the container: healthcheck, docker exec, pgbackrest.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# Compose network: postgrest, authapp, hydra, backup.
host    all             all             172.16.0.0/12           scram-sha-256
