# Client authentication for the production Postgres container.
#
# Mounted into the db service and selected with `-c hba_file=` so that the
# rules live in git rather than in the data volume, where the postgres image
# wrote its defaults at initdb time. First match wins, so order matters.
#
# The db container's network namespace is shared with the db-tailscale
# sidecar (docker-compose.prod.yaml), which puts this Postgres on the tailnet
# as `mgt656-db`. The sidecar runs in kernel mode, so tailnet clients arrive
# with their real 100.64.0.0/10 addresses and hit the scram line below. In
# userspace mode they would arrive from 127.0.0.1 and match `trust` -- that is
# why the sidecar must never be switched to TS_USERSPACE=true.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Inside the container: healthcheck, docker exec, pgbackrest.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# Compose network: postgrest, authapp, hydra, backup.
host    all             all             172.16.0.0/12           scram-sha-256

# Tailnet: only the administrative role, only from tailnet addresses. The
# policy in kljensen/home-provisioning (tag:mgt656-db) limits who can reach
# the port at all; this limits which role they can be once they do.
host    all             superuser       100.64.0.0/10           scram-sha-256
