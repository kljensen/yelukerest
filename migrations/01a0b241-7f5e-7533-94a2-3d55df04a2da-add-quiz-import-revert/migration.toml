[[allow]]
lint = "lint.constraint_scans_table"
reason = "The three CHECKs restate rules every existing item already satisfies, with a fourth mutation and a demotion added, so the validating scan cannot fail. The ledger holds one course's quiz imports -- at most a few thousand items, not millions -- so the scan is bounded by that. ADD CONSTRAINT takes the same ACCESS EXCLUSIVE lock with or without NOT VALID, and this migration runs inside the transaction Zapadka owns, so VALIDATE could not be separated from it anyway."
