format_version = 1

# This migration's permanent identity. Never change it.
id = "01a0147d-0c0a-7ee0-b958-4edaf8525670"

# The migrations that must be applied before this one. Order within the list
# does not matter; these are graph edges, not a sequence.
depends = ["01a011e3-29f7-70c0-969c-b289cab26e1f"]

# "required" runs deploy.sql inside a transaction Zapadka owns.
transaction = "required"

# Reversible in the sense the revert script can restore the schema exactly: the
# table is new, nothing else references it, and the platform version goes back
# to 5. It does not restore rows, and here that is a sharper loss than it was
# for the repository mapping -- see revert.sql.
reversibility = "reversible"

[[allow]]
lint = "lint.index_without_concurrently"
reason = "Both indexes are built on data.assignment_repository_snapshot, which is created a few statements earlier in this same transaction: it has no rows to scan and no concurrent writer can see it yet. CONCURRENTLY is also unavailable, since it cannot run inside the transaction Zapadka owns."
