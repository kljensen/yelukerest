format_version = 1

# This migration's permanent identity. Never change it.
id = "01a011e3-29f7-70c0-969c-b289cab26e1f"

# The migrations that must be applied before this one. Order within the list
# does not matter; these are graph edges, not a sequence.
depends = ["01a010ab-a183-76b2-952d-8cc0805747d5"]

# "required" runs deploy.sql inside a transaction Zapadka owns.
transaction = "required"

# Reversible in the sense the revert script can restore the schema exactly: the
# table is new, nothing else references it, and the platform version goes back
# to 4. It does not restore rows -- see revert.sql on why that is acceptable
# here and what reverting after real provisioning actually costs.
reversibility = "reversible"

[[allow]]
lint = "lint.index_without_concurrently"
reason = "Every index here is built on data.assignment_repository, which is created a few statements earlier in this same transaction: it has no rows to scan and no concurrent writer can see it yet. CONCURRENTLY is also unavailable, since it cannot run inside the transaction Zapadka owns."
