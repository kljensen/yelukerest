volumes:
    # A named volume to share data between containers
    elmclient-build:
        external: false
    caddy_data:
    caddy_config:
    codeframe_db:
services:
    elmclient:
        build:
            context: elmclient
            target: app
        # Set the location where docker will put our files
        working_dir: /opt/app
        environment:
            - DEVELOPMENT=${DEVELOPMENT}
            - PIAZZA_URL=${ELMCLIENT_PIAZZA_URL}
            - ABOUT_URL=${ELMCLIENT_ABOUT_URL}
            - CANVAS_URL=${ELMCLIENT_CANVAS_URL}
            - SLACK_URL=${ELMCLIENT_SLACK_URL}
            - COURSE_TITLE=${ELMCLIENT_COURSE_TITLE}
        volumes:
            - elmclient-build:/opt/app/dist
            - './elmclient/src:/opt/app/src'
            - './elmclient/tests:/opt/app/tests'
            - './elmclient/run.sh:/opt/app/run.sh'
            - './elmclient/build.sh:/opt/app/build.sh'
        entrypoint: '/opt/app/run.sh'

    elmclient-test:
        profiles:
            - test
        build:
            context: elmclient
            target: test
        working_dir: /opt/app
        volumes:
            - './elmclient/src:/opt/app/src'
            - './elmclient/tests:/opt/app/tests'
            - './elmclient/elm.json:/opt/app/elm.json'
        entrypoint:
            - elm-test-rs
            - --deno

    # PostgREST instance, is responsible for communicating with the database
    # and providing a REST api, (almost) every request that is sent to the database goes through it
    postgrest:
        # unless-stopped, not on-failure: on-failure does not bring a container
        # back when the docker daemon itself restarts, and postgrest died with
        # exit 133 mid-life with nothing to restart it, taking the API down.
        restart: unless-stopped
        # PostgREST 16.2, pinned by immutable manifest digest: a tag can be
        # repointed and Compose will reuse a same-named local image, so only a
        # digest proves which bytes are running. Override POSTGREST_IMAGE to roll
        # back (14.14 was sha256:65c4c60d236a652075cc8208d7c6e2cf9bceb873a2650287496bf76c9d92fdbe).
        image: ${POSTGREST_IMAGE:-ghcr.io/kljensen/docker-postgrest-static@sha256:a9ec99a1191f7409ee6c6259d69bb32b8203a21adfa3479f1ee2d0bf98fa1e89}
        ports:
            - '127.0.0.1:3000:${POSTGREST_PORT}'
        environment:
            - PGRST_DB_URI=postgres://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}
            - PGRST_DB_SCHEMAS=${DB_SCHEMA}
            - PGRST_DB_ANON_ROLE=${DB_ANON_ROLE}
            - PGRST_DB_POOL=${DB_POOL}
            - PGRST_JWT_SECRET=${JWT_SECRET}
            - PGRST_DB_MAX_ROWS=${MAX_ROWS}
            - PGRST_DB_PRE_REQUEST=${PRE_REQUEST:-api.check_request_jwt}
            - PGRST_OPENAPI_SERVER_PROXY_URI=${SERVER_PROXY_URI}
            - PGRST_LOG_LEVEL=${PGRST_LOG_LEVEL:-error}

    # Caddy instance that sits in front of PostgREST.
    # All the requests coming into the system are first hitting this component.
    # After some processing/checks and transformation, the request is forwarded
    # to PostgREST down the stack.
    caddy:
        build: caddy
        ports:
            - '${CADDY_LISTEN_HOST}:80:80'
            - '${CADDY_LISTEN_HOST}:443:443'
            - '${CADDY_LISTEN_HOST}:443:443/udp'
        restart: unless-stopped
        environment:
            - FQDN=${FQDN}
            - CADDY_ENV=${CADDY_ENV:-production}
            - NAKED_FQDN=${NAKED_FQDN}
            - POSTGREST_PORT=${POSTGREST_PORT}
            - AUTHAPP_PORT=${AUTHAPP_PORT}
            - MCPAPP_PORT=${MCPAPP_PORT:-8090}
            - CODEFRAME_PORT=${CODEFRAME_PORT:-4556}
            - HYDRA_PUBLIC_PORT=${HYDRA_PUBLIC_PORT:-4444}
            - AWS_ACCESS_KEY_ID=${CADDY_ACME_ACCESS_KEY_ID}
            - AWS_SECRET_ACCESS_KEY=${CADDY_ACME_SECRET_ACCESS_KEY}
            - AWS_REGION=${CADDY_ACME_AWS_REGION}

        volumes:
            - elmclient-build:/var/elmclient/
            - './caddy/Caddyfile:/etc/caddy/Caddyfile'
            - './caddy/development.caddyfile:/etc/caddy/development.caddyfile'
            - './caddy/production.caddyfile:/etc/caddy/production.caddyfile'
            - './caddy/html:/usr/share/caddy/html'
            - './caddy/user_code:/usr/share/caddy/user_code'
            - caddy_data:/data
            - caddy_config:/config

    # Codeframe. One container, reached through Caddy on two hostnames: the
    # editor at editor.<domain>, behind CAS, and the pages it publishes at
    # code.<domain>, public and cookie-free (issue #359). Students write a page
    # and submit the URL it is hosted at, so this is storage as much as it is
    # an editor -- the volume below holds every page anyone has ever
    # submitted, and losing it breaks links recorded against past assignments.
    # No ports here on purpose: every request must come through Caddy, which is
    # what enforces the split.
    codeframe:
        build: codeframe
        restart: unless-stopped
        environment:
            - PORT=${CODEFRAME_PORT:-4556}
            # Origin the editor points saved previews at (issues #359, #360).
            # The editor and the artifacts it publishes must not share an
            # origin, or a page a student wrote could publish as whoever is
            # viewing it. Codeframe stamps this into the editor page so a
            # saved preview loads from the public artifact host instead of
            # window.location.origin. Caddy redirects /f/* off the editor
            # host as well, so the split holds even if this is unset.
            - CODEFRAME_ARTIFACT_ORIGIN=https://code.${NAKED_FQDN}
        volumes:
            - codeframe_db:/codeframe/db

    # Ory Hydra: OAuth 2.1 authorization server for MCP clients
    # (docs/adr/0001-mcp-and-oauth.md, issue #270).
    # Pinned by tag for now; recorded digest for later digest-pinning:
    # oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    hydra:
        image: oryd/hydra:v26.2.0
        command: serve all -c /etc/hydra/hydra.yml --sqa-opt-out
        restart: unless-stopped
        # NO ports section on purpose: the public API (4444) is reached only
        # by Caddy over the internal compose network, and the admin API
        # (4445) is never published to the host and never proxied by Caddy.
        environment:
            # The DSN (storage backend) comes from the dev/prod overlays:
            # "memory" for the fast dev loop, Postgres in production.
            # SECRETS_SYSTEM encrypts Hydra's data at rest; rotation
            # procedure is documented in docs/hydra.md.
            - SECRETS_SYSTEM=${HYDRA_SECRETS_SYSTEM}
            # Issuer and endpoint URLs. See hydra/hydra.yml for why the
            # issuer is the domain root rather than a path prefix.
            - URLS_SELF_ISSUER=https://${FQDN}
            - URLS_LOGIN=https://${FQDN}/auth/oauth/login
            - URLS_CONSENT=https://${FQDN}/auth/oauth/consent
            - WEBFINGER_OIDC_DISCOVERY_CLIENT_REGISTRATION_URL=https://${FQDN}/oauth2/register
        volumes:
            - './hydra/hydra.yml:/etc/hydra/hydra.yml:ro'

    authapp:
        restart: unless-stopped
        build: authapp
        ports:
            - '127.0.0.1:${AUTHAPP_HOST_PORT}:${AUTHAPP_PORT}'
        environment:
            - DEVELOPMENT=${DEVELOPMENT}
            - PORT=${AUTHAPP_PORT}
            - CAS_URI=${AUTHAPP_CAS_URI}
            - CAS_VALIDATION_URI=${AUTHAPP_CAS_VALIDATION_URI}
            - POSTGREST_HOST=${POSTGREST_HOST}
            - POSTGREST_PORT=${POSTGREST_PORT}
            - AUTHAPP_JWT=${AUTHAPP_JWT}
            # Sessions live in PostgreSQL rather than in this process's memory
            # (issue #365): recreating the container used to sign everyone out.
            # sslmode=disable is acceptable only because this never leaves the
            # internal compose network, the same reasoning Hydra's DSN carries.
            # The role is created once per cluster by
            # authapp/sql/create-authapp-db-role.sh -- nothing bootstraps it.
            - AUTHAPP_DB_URL=postgres://${AUTHAPP_DB_USER:-authapp}:${AUTHAPP_DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable
            # Titles the OpenAPI document at /openapi/, which PostgREST
            # otherwise calls "PostgREST API". Same value the web client
            # is built with, so both name the course identically.
            - COURSE_TITLE=${ELMCLIENT_COURSE_TITLE}
            - JWT_ISSUER=${JWT_ISSUER:-yelukerest}
            - JWT_AUDIENCE=${JWT_AUDIENCE:-yelukerest-postgrest}
            # For the DCR response-cleaning proxy (issue #272,
            # ory/hydra#4044): Hydra's public API on the internal
            # network, and the MCP resource URL injected as the client
            # audience allowlist (falls back to https://$FQDN/mcp).
            - HYDRA_PUBLIC_INTERNAL_URL=${HYDRA_PUBLIC_INTERNAL_URL:-http://hydra:4444}
            - MCP_RESOURCE_URL=${MCP_RESOURCE_URL:-}
            - FQDN=${FQDN}
            # Per-IP ceilings on the public, unauthenticated OAuth
            # surfaces (issue #330). A class shares a few campus NAT
            # addresses, so these are sized for a whole cohort connecting
            # at once, not for one person. Lower them during an incident;
            # see authapp/main.go for how the numbers were derived.
            # /oauth2/register carries both a per-minute and a per-hour
            # ceiling: the minute one absorbs the class, the hour one
            # bounds a sustained flood of Hydra client rows that a
            # per-minute limit alone would let through.
            - DCR_RATE_LIMIT_PER_MINUTE=${DCR_RATE_LIMIT_PER_MINUTE:-300}
            - DCR_RATE_LIMIT_PER_HOUR=${DCR_RATE_LIMIT_PER_HOUR:-1200}
            - OAUTH_RATE_LIMIT_PER_MINUTE=${OAUTH_RATE_LIMIT_PER_MINUTE:-600}

    mcpapp:
        restart: unless-stopped
        build: mcpapp
        ports:
            - '127.0.0.1:${MCPAPP_HOST_PORT:-8090}:${MCPAPP_PORT:-8090}'
        environment:
            - DEVELOPMENT=${DEVELOPMENT}
            - PORT=${MCPAPP_PORT:-8090}
            # No JWT_SECRET here on purpose: /mcp accepts OAuth access tokens
            # only (issue #322), so mcpapp verifies nothing with the shared
            # secret and has no reason to hold it. The one credential it does
            # need is MCPAPP_JWT below, which is already signed.
            - POSTGREST_HOST=${POSTGREST_HOST}
            - POSTGREST_PORT=${POSTGREST_PORT}
            # Advertised in the RFC 9728 protected-resource metadata so
            # MCP clients can discover the authorization server. Hydra's
            # issuer is the domain root (see hydra/hydra.yml).
            - HYDRA_PUBLIC_URL=${HYDRA_PUBLIC_URL:-https://${FQDN}}
            - MCP_STATELESS_ENABLED=${MCP_STATELESS_ENABLED:-true}
            # The postgrest_request escape hatch is GET-only unless this
            # is turned on (issue #331): raw POST/PATCH/DELETE has neither
            # the row scoping nor the stale-write check that
            # submit_submission_change enforces.
            - MCP_ESCAPE_HATCH_WRITES_ENABLED=${MCP_ESCAPE_HATCH_WRITES_ENABLED:-false}
            - MCP_RESOURCE_URL=${MCP_RESOURCE_URL:-}
            - FQDN=${FQDN}
            # role=app app_name=mcpapp service credential used to exchange
            # a verified OAuth token for an internal PostgREST credential
            # via api.issue_user_jwt_for_mcp (issue #274). Mint with
            # ./bin/jwt.sh '{"role":"app","app_name":"mcpapp"}'.
            - MCPAPP_JWT=${MCPAPP_JWT:-}
            # Hydra's JWKS is fetched over the internal compose network so
            # it never traverses Caddy's development TLS certificate.
            - HYDRA_PUBLIC_INTERNAL_URL=${HYDRA_PUBLIC_INTERNAL_URL:-http://hydra:4444}
